name: Quizora web checks
on:
  push:
    branches: [main, 'iteration-3/**']
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install web dependencies
        run: python -m pip install -r web/requirements.txt pytest==9.2.0
      - name: Test authentication, grading, data ownership, and concurrent submissions
        run: python -m pytest web -q
      - name: Check browser JavaScript syntax
        run: node --check web/static/app.js
